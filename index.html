<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pelacak Keuangan</title>
<style>
:root{--bg:#f6f7f8;--card:#fff;--text:#1b1f23;--t2:#5b6168;--line:#d8dce0;--teal:#0F6E56;--tbg:#E1F5EE;--pur:#534AB7;--pbg:#EEEDFE;--red:#b3261e;--on:#fff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16181a;--card:#1f2225;--text:#eceef0;--t2:#a7adb3;--line:#363a3e;--teal:#5DCAA5;--tbg:#085041;--pur:#AFA9EC;--pbg:#3C3489;--red:#f2b8b5;--on:#04342C;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#16181a;--card:#1f2225;--text:#eceef0;--t2:#a7adb3;--line:#363a3e;--teal:#5DCAA5;--tbg:#085041;--pur:#AFA9EC;--pbg:#3C3489;--red:#f2b8b5;--on:#04342C;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:480px;margin:0 auto;padding:20px 16px 110px}
h1{font-size:22px;font-weight:500;margin:0 0 16px}
#acct{max-width:480px;margin:0 auto;padding:12px 16px 0;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--t2)}
#acct:empty{display:none}
#acct span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#acct button{border:0;background:none;font:inherit;font-size:13px;color:var(--teal);cursor:pointer}
#acct button.d{color:var(--red)}
.chk{display:flex;gap:8px;align-items:flex-start;color:var(--text);font-size:14px}
.chk input{width:auto;margin-top:4px}
h2{font-size:15px;font-weight:500;margin:20px 0 4px;color:var(--t2)}
label{display:block;font-size:14px;color:var(--t2);margin:14px 0 4px}
input,select{width:100%;font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--teal);outline-offset:1px}
.big{font-size:28px;font-weight:500;margin:6px 0 0}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{flex:1;border:0;background:none;color:var(--t2);font:inherit;padding:10px;border-radius:9px;cursor:pointer}
.seg button.on{background:var(--tbg);color:var(--teal);font-weight:500}
.btn{width:100%;margin-top:20px;border:0;border-radius:12px;background:var(--teal);color:var(--on);font:inherit;font-weight:500;padding:13px;cursor:pointer}
.btn.ghost{background:none;color:var(--t2);border:1px solid var(--line);margin-top:10px;font-weight:400}
.msg{min-height:22px;margin:10px 0 0;font-size:14px;color:var(--red)}
.hint{font-size:13px;color:var(--t2);margin-top:14px}
.chip{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;background:var(--pbg);color:var(--pur)}
.chip.gray{background:var(--line);color:var(--t2)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0}
.top{display:flex;justify-content:space-between;gap:12px}
.sub{font-size:13px;color:var(--t2)}
.amt{white-space:nowrap;font-weight:500}.amt.in{color:var(--teal)}
.ctl{display:flex;gap:8px;align-items:center;margin-top:10px}
.ctl select{padding:6px 8px;font-size:14px}
.del{margin-left:auto;border:0;background:none;color:var(--red);font:inherit;font-size:14px;cursor:pointer}
.met{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.met div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}
.met small{display:block;font-size:12px;color:var(--t2)}.met b{font-size:15px;font-weight:500}
.brow{display:grid;grid-template-columns:84px 1fr auto;gap:8px;align-items:center;font-size:14px;margin:9px 0}
.trk{height:8px;border-radius:4px;background:var(--line)}.bar{height:8px;border-radius:4px;background:var(--teal)}
.rev{background:var(--pbg);color:var(--text);border-radius:12px;padding:12px 14px;margin-top:16px;font-size:15px}
.rev .chip{margin-bottom:6px;background:none;padding:0;font-weight:500}
.empty{color:var(--t2);text-align:center;padding:28px 0}
#tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
#tabs button{flex:1;border:0;background:none;color:var(--t2);font:inherit;font-size:14px;padding:10px 4px;border-radius:10px;cursor:pointer}
#tabs button.on{color:var(--teal);font-weight:500;background:var(--tbg)}
#toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}
#toast.show{opacity:1}
</style>
</head>
<body>
<header id="acct"></header>
<main id="app"></main>
<nav id="tabs"><button data-t="add">Catat</button><button data-t="hist">Riwayat</button><button data-t="sum">Ringkasan</button></nav>
<div id="toast" role="status"></div>
<script>
const FEEDBACK_URL=""; /* tempel link Google Form di antara tanda kutip */
const $=s=>document.querySelector(s);
const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}},sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let acct=null,data=[];
const keyOf=e=>'ft_v1:'+e;
const persist=()=>{if(acct)sv(keyOf(acct.email),data)};
const rp=n=>"Rp"+Math.round(n).toLocaleString("id-ID"), pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const OUT=["Makanan","Transport","Kuliah","Tagihan","Belanja","Hiburan","Kesehatan","Lainnya"], INC=["Uang saku","Kerja","Lainnya"];
const KW={out:{Makanan:["warung","makan","nasi","bakso","kopi","mie","ayam","jajan","minum","kantin","soto","bubur"],Transport:["ojek","gojek","grab","bensin","parkir","angkot","bus","tol"],Kuliah:["buku","fotokopi","print","kursus","pulpen","spp"],Tagihan:["listrik","wifi","pulsa","kos","sewa","pdam","token","kuota"],Belanja:["baju","sepatu","tas","belanja","shopee","tokopedia"],Hiburan:["film","bioskop","game","nonton","spotify","netflix"],Kesehatan:["obat","dokter","apotek","vitamin","klinik"]},in:{"Uang saku":["uang saku","kiriman","orang tua"],Kerja:["gaji","freelance","kerja","honor","upah"]}};
function suggest(type,text){const t=text.toLowerCase(),tab=KW[type];for(const c in tab)for(const w of tab[c])if(new RegExp("\\b"+w+"\\b").test(t))return c;return "Lainnya"}
let tab="add",type="out",month=null,sure=false;
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove("show"),2600)}
let sureA=false,authMode='up';
function render(){bar();if(!acct){viewAuth();return}$('#tabs').style.display='';document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));({add:viewAdd,hist:viewHist,sum:viewSum})[tab]();scrollTo(0,0)}
function bar(){const a=$('#acct');if(!acct){a.innerHTML='';return}
 a.innerHTML=`<span>Masuk sebagai <b>${esc(acct.name)}</b> · ${esc(acct.email)}</span><button id='out'>Keluar</button><button id='dacc' class='d'>Hapus akun</button>`;
 $('#out').onclick=()=>{try{localStorage.removeItem('ft_session')}catch(e){}acct=null;data=[];render()};
 $('#dacc').onclick=()=>{const b=$('#dacc');if(!sureA){sureA=true;b.textContent='Yakin? Tekan lagi';setTimeout(()=>{sureA=false;const x=$('#dacc');if(x)x.textContent='Hapus akun'},3000);return}
  sv('ft_accounts',ld('ft_accounts',[]).filter(x=>x.email!=acct.email));try{localStorage.removeItem(keyOf(acct.email));localStorage.removeItem('ft_session')}catch(e){}acct=null;data=[];sureA=false;render()}}
function viewAuth(){$('#tabs').style.display='none';const up=authMode=='up';
 $('#app').innerHTML=`<h1>${up?'Buat akun':'Masuk'}</h1><div class='seg'><button data-m='up' class='${up?'on':''}'>Daftar</button><button data-m='in' class='${up?'':'on'}'>Masuk</button></div>${up?`<label for='nm'>Nama panggilan</label><input id='nm' autocomplete='nickname' placeholder='mis. Jo'>`:''}<label for='em'>Email</label><input id='em' type='email' autocomplete='email' placeholder='nama@email.com'>${up?`<label class='chk'><input id='ok' type='checkbox'>Email ini hanya dipakai untuk memisahkan data keuanganku dari pengguna lain.</label>`:''}<button class='btn' id='go'>${up?'Buat akun':'Masuk'}</button><p class='msg' id='msg' role='alert'></p><div class='rev'><span class='chip'>Mode demo</span><br>Belum ada kata sandi, dan akun serta datamu hanya tersimpan di browser ini. Di versi sebenarnya, login ditangani server (mis. Supabase Auth) supaya data tidak bisa dibuka orang lain.</div>`;
 document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{authMode=b.dataset.m;viewAuth()});
 $('#go').onclick=()=>{const em=$('#em').value.trim().toLowerCase(),list=ld('ft_accounts',[]),ex=list.find(a=>a.email==em),m=t=>{$('#msg').textContent=t};
  if(em.indexOf(' ')>=0||em.indexOf('@')<1||em.lastIndexOf('.')<em.indexOf('@')+2||em.lastIndexOf('.')>=em.length-1)return m('Masukkan email yang valid.');
  if(up){const nm=$('#nm').value.trim();if(nm.length<2)return m('Isi nama panggilan (minimal 2 huruf).');if(!$('#ok').checked)return m('Centang persetujuan dulu.');if(ex)return m('Email sudah terdaftar. Silakan pilih Masuk.');acct={email:em,name:nm,created:new Date().toISOString()};list.push(acct);sv('ft_accounts',list)}
  else{if(!ex)return m('Email belum terdaftar. Silakan pilih Daftar.');acct=ex}
  sv('ft_session',acct.email);data=ld(keyOf(acct.email),[]);tab='add';render()}}
document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;sure=false;render()});

function viewAdd(){
 const today=ymd(new Date());
 $("#app").innerHTML=`<h1>Catat transaksi</h1>
 <div class="seg"><button data-y="out" class="${type=="out"?"on":""}">Pengeluaran</button><button data-y="in" class="${type=="in"?"on":""}">Pemasukan</button></div>
 <label for="amt">Jumlah (Rp)</label><input id="amt" inputmode="numeric" autocomplete="off" placeholder="0"><div class="big" id="show">Rp0</div>
 <label for="why">Untuk apa? (opsional)</label><input id="why" autocomplete="off" placeholder="mis. Warung Bu Ani">
 <label for="dt">Tanggal</label><input id="dt" type="date" value="${today}" max="${today}">
 <button class="btn" id="save">Simpan</button><p class="msg" id="msg" role="alert"></p>
 <p class="hint">Kategori dipilih otomatis dari alasan (<span class="chip">otomatis</span>) dan bisa diubah di Riwayat. Waktu input dicatat otomatis.</p>`;
 const num=()=>parseInt($("#amt").value.replace(/\D/g,""),10)||0;
 $("#amt").oninput=e=>{const n=num();e.target.value=n?n.toLocaleString("id-ID"):"";$("#show").textContent=rp(n);$("#msg").textContent=""};
 document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{type=b.dataset.y;document.querySelectorAll(".seg button").forEach(x=>x.classList.toggle("on",x===b))});
 $("#save").onclick=()=>{
  const n=num();
  if(n<1){$("#msg").textContent="Jumlah harus lebih dari nol.";$("#amt").focus();return}
  const why=$("#why").value.trim(), cat=suggest(type,why);
  data.unshift({id:Date.now(),type,amount:n,category:cat,note:why,date:$("#dt").value||today,created:new Date().toISOString(),source:"rules"});
  persist();toast("Tersimpan: "+(type=="in"?"Pemasukan":"Pengeluaran")+" · "+rp(n)+" · "+cat);
  $("#amt").value="";$("#why").value="";$("#show").textContent="Rp0";$("#msg").textContent="";
 };
}

function viewHist(){
 const rows=[...data].sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
 $("#app").innerHTML=`<h1>Riwayat</h1>`+(rows.length?rows.map(r=>`<div class="card" data-id="${r.id}"><div class="top"><div><b>${esc(r.note||"(tanpa alasan)")}</b><div class="sub">${r.date} · dicatat ${new Date(r.created).toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit"})}</div></div><div class="amt ${r.type}">${r.type=="in"?"+":"−"}${rp(r.amount)}</div></div><div class="ctl"><select aria-label="Kategori">${(r.type=="in"?INC:OUT).map(c=>`<option${c==r.category?" selected":""}>${c}</option>`).join("")}</select><span class="chip ${r.source=="rules"?"":"gray"}">${r.source=="rules"?"otomatis":"manual"}</span><button class="del">Hapus</button></div></div>`).join(""):`<p class="empty">Belum ada transaksi.</p>`)+
 `<h2>Untuk pengujian</h2><button class="btn ghost" id="exp">Ekspor data (CSV)</button><button class="btn ghost" id="cpy">Salin data</button>${FEEDBACK_URL?'<a class="btn ghost" style="display:block;text-align:center;text-decoration:none;box-sizing:border-box" href="'+FEEDBACK_URL+'" target="_blank" rel="noopener">Kirim feedback</a>':""}<p class="hint">Ekspor tidak memuat email dan tidak menyertakan data contoh.</p><button class="btn ghost" id="smp">Muat data contoh (3 bulan)</button><button class="btn ghost" id="clr">${sure?"Yakin hapus semua? Tekan lagi":"Hapus semua data saya"}</button>`;
 const app=$("#app");
 app.onchange=e=>{if(e.target.tagName!="SELECT")return;const r=data.find(x=>x.id==e.target.closest(".card").dataset.id);r.category=e.target.value;r.source="manual";persist();viewHist()};
 app.onclick=e=>{if(e.target.classList.contains("del")){const id=e.target.closest(".card").dataset.id;data=data.filter(x=>x.id!=id);persist();viewHist()}};
 $("#exp").onclick=()=>{const t=csvText();if(t.split("\n").length<2){toast("Belum ada data untuk diekspor");return}const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+t],{type:"text/csv"}));a.download="data-keuangan.csv";document.body.appendChild(a);a.click();a.remove();toast("File CSV diunduh")};
 $("#cpy").onclick=async()=>{const t=csvText();if(t.split("\n").length<2){toast("Belum ada data untuk disalin");return}try{await navigator.clipboard.writeText(t);toast("Data disalin. Tempel ke pesan atau formulir.")}catch(e){toast("Gagal menyalin. Coba tombol Ekspor.")}};
 $("#smp").onclick=()=>{sample();toast("Data contoh dimuat");viewHist()};
 $("#clr").onclick=()=>{if(!sure){sure=true;viewHist();setTimeout(()=>{sure=false},3000);return}data=[];persist();sure=false;toast("Semua data dihapus");viewHist()};
}

function csvText(){
 const q=s=>'"'+String(s).replace(/"/g,'""')+'"';
 const rows=data.filter(d=>!String(d.note).startsWith("[contoh]")).map(d=>[d.date,d.type=="in"?"Pemasukan":"Pengeluaran",d.amount,d.category,q(d.note),d.source,d.created].join(","));
 return ["tanggal,tipe,jumlah,kategori,catatan,sumber,dicatat",...rows].join("\n");
}
function sample(){
 let s=42;const r=()=>(s=(s*1664525+1013904223)%4294967296)/4294967296;
 const it=[["Warung Bu Ani",18000,6],["Nasi goreng",15000,4],["Kopi",12000,4],["Ojek ke kampus",10000,4],["Bensin",25000,2],["Fotokopi tugas",6000,3],["Beli buku",75000,1],["Paket kuota",50000,1],["Nonton film",45000,1],["Beli baju",120000,1],["Obat flu",20000,1]];
 const tot=it.reduce((a,x)=>a+x[2],0), now=new Date();
 for(let mb=2;mb>=0;mb--){
  const base=new Date(now.getFullYear(),now.getMonth()-mb,1), last=mb?28:now.getDate();
  data.push({id:Date.now()+mb*1000,type:"in",amount:1500000,category:"Uang saku",note:"[contoh] Uang saku bulanan",date:ymd(base),created:new Date().toISOString(),source:"rules"});
  for(let i=0;i<14;i++){
   let x=r()*tot,p=it[0];for(const q of it){if((x-=q[2])<0){p=q;break}}
   const d=new Date(base.getFullYear(),base.getMonth(),1+Math.floor(r()*last));
   data.push({id:Date.now()+mb*1000+i+1,type:"out",amount:Math.max(1000,Math.round(p[1]*(0.8+0.4*r())/1000)*1000),category:suggest("out",p[0]),note:"[contoh] "+p[0],date:ymd(d),created:new Date().toISOString(),source:"rules"});
  }
 }
 persist();
}

function agg(m){const by={};let inc=0,out=0;data.forEach(d=>{if(!d.date.startsWith(m))return;if(d.type=="in")inc+=d.amount;else{out+=d.amount;by[d.category]=(by[d.category]||0)+d.amount}});return{inc,out,by}}
function viewSum(){
 const ms=[...new Set(data.map(d=>d.date.slice(0,7)))].sort().reverse();
 if(!ms.length){$("#app").innerHTML=`<h1>Ringkasan bulanan</h1><p class="empty">Belum ada data. Catat transaksi atau muat data contoh di Riwayat.</p>`;return}
 if(!ms.includes(month))month=ms[0];
 const [y,mo]=month.split("-").map(Number), pk=mo==1?(y-1)+"-12":y+"-"+pad(mo-1);
 const a=agg(month), p=agg(pk), cats=Object.entries(a.by).sort((x,z)=>z[1]-x[1]), bal=a.inc-a.out;
 const label=k=>{const [yy,mm]=k.split("-").map(Number);return new Date(yy,mm-1,1).toLocaleDateString("id-ID",{month:"long",year:"numeric"})};
 let rev="";
 if(cats.length){const top=cats[0],low=cats[cats.length-1];rev=`Bulan ini kamu mengeluarkan ${rp(a.out)} dan menerima ${rp(a.inc)}. Paling banyak untuk ${top[0]} (${rp(top[1])}), paling sedikit untuk ${low[0]} (${rp(low[1])}).`;
  if(p.out)rev+=` Dibanding bulan lalu, pengeluaranmu ${a.out>=p.out?"naik":"turun"} ${rp(Math.abs(a.out-p.out))}.`}
 const names=[...new Set([...Object.keys(a.by),...Object.keys(p.by)])];
 $("#app").innerHTML=`<h1>Ringkasan bulanan</h1>
 <select id="mo" aria-label="Bulan">${ms.map(m=>`<option value="${m}"${m==month?" selected":""}>${label(m)}</option>`).join("")}</select>
 <div class="met" style="margin-top:12px"><div><small>Pemasukan</small><b>${rp(a.inc)}</b></div><div><small>Pengeluaran</small><b>${rp(a.out)}</b></div><div><small>Saldo</small><b>${bal<0?"−":""}${rp(Math.abs(bal))}</b></div></div>
 <h2>Pengeluaran per kategori</h2>`+(cats.length?cats.map(([c,v])=>`<div class="brow"><span>${c}</span><div class="trk"><div class="bar" style="width:${Math.round(v/cats[0][1]*100)}%"></div></div><span>${rp(v)}</span></div>`).join(""):`<p class="empty">Tidak ada pengeluaran di bulan ini.</p>`)+
 (p.out&&cats.length?`<h2>Dibanding ${label(pk)}</h2>`+names.map(c=>{const d=(a.by[c]||0)-(p.by[c]||0);return `<div class="brow" style="grid-template-columns:1fr auto"><span>${c}</span><span style="color:var(--t2)">${d==0?"sama":(d>0?"naik ":"turun ")+rp(Math.abs(d))}</span></div>`}).join(""):"")+
 (rev?`<div class="rev"><span class="chip">Ulasan</span><br>${rev}</div><p class="hint">Semua angka dihitung oleh kode. Di versi Streamlit, AI yang menuliskan penjelasannya.</p>`:"");
 $("#mo").onchange=e=>{month=e.target.value;viewSum()};
}
(()=>{const e=ld('ft_session',null),a=e&&ld('ft_accounts',[]).find(x=>x.email==e);if(a){acct=a;data=ld(keyOf(a.email),[])}render()})();
</script>
</body>
</html>
